<!DOCTYPE html>
<html lang="{{ site.lang | default: "ru-RU" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    {% include head-custom.html %}
    <title>{{ page.title | default: site.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center space-x-4">
            <a href="/" class="text-2xl font-bold text-gray-900">
              {{ site.title | default: "DDD Course" }}
            </a>
          </div>
          <nav class="hidden md:flex space-x-8">
            <a href="#" class="text-gray-700 hover:text-gray-900 font-medium">Home</a>
            <a href="#" class="text-gray-700 hover:text-gray-900 font-medium">About</a>
            <a href="#" class="text-gray-700 hover:text-gray-900 font-medium">Courses</a>
            <a href="#" class="text-gray-700 hover:text-gray-900 font-medium">Contact</a>
          </nav>
          <button class="md:hidden">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-grow">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{ content }}
      </div>
    </main>

    <footer class="bg-white mt-12 border-t border-gray-200">
      <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <p class="text-center text-gray-500 text-sm">
          &copy; {{ 'now' | date: "%Y" }} {{ site.title | default: "DDD Course" }}. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
