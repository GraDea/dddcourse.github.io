<!-- Favicon -->
<link rel="icon" type="image/jpg" href="{{ '/assets/images/logo.jpg' | relative_url }}">

<!-- Meta -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="language" content="russian">
<meta name="copyright" content="DDDevotion">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.subtitle | default: site.description }}">
<meta property="og:image" content="{{ '/assets/images/social-preview.jpg' | absolute_url }}">
<meta property="og:locale" content="ru_RU">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ site.url }}{{ page.url | relative_url }}">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.subtitle | default: site.description }}">
<meta name="twitter:image" content="{{ '/assets/images/social-preview.jpg' | absolute_url }}">

<!-- SEO -->
<meta name="description" content="{{ page.subtitle | default: site.description }}">
<meta name="keywords" content="DDD, Domain-Driven Design, DDD обучение, DDD курсы, проектирование ПО, архитектура ПО, DDD паттерны">
<link rel="canonical" href="{{ site.url }}{{ page.url | absolute_url }}">

<!-- Styles -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
